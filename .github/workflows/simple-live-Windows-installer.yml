name: simple-live-Windows-installer

# 手动触发：可以在 Actions 页面点击 "Run workflow" 运行
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的源仓库 release tag（留空则自动使用源仓库最新 release）"
        required: false
        default: ""
      flutter_version:
        description: "Flutter 版本（留空使用 stable 最新版；仓库当前用 3.41.9）"
        required: false
        default: "3.41.9"

env:
  # 源码仓库：workflow 从这里检测最新 release、下载 Source code 并编译
  # 注意：这与运行本 workflow 所在的仓库（github.repository）是两回事
  SOURCE_REPO: June6699/dart_simple_live

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-2022

    steps:
      # 0. 检出当前仓库自身（用于后续在本仓库创建 release/tag，与源码下载互不影响）
      - name: 检出当前仓库
        uses: actions/checkout@v4

      # 1. 确定要构建的版本：用户输入的 tag，或源仓库当前最新 release
      - name: 获取源仓库最新 Release 信息
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ env.SOURCE_REPO }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -e
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
            RELEASE_JSON=$(gh api "repos/$REPO/releases/tags/$TAG")
          else
            RELEASE_JSON=$(gh api "repos/$REPO/releases/latest")
            TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          fi

          ZIPBALL_URL=$(echo "$RELEASE_JSON" | jq -r '.zipball_url')
          SOURCE_RELEASE_NAME=$(echo "$RELEASE_JSON" | jq -r '.name // .tag_name')
          SOURCE_RELEASE_URL=$(echo "$RELEASE_JSON" | jq -r '.html_url')

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zipball_url=$ZIPBALL_URL" >> "$GITHUB_OUTPUT"
          echo "source_release_name=$SOURCE_RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "source_release_url=$SOURCE_RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "检测到源仓库 ($REPO) tag: $TAG"

      # 2. 下载该 release 对应的 Source code (zip)，而不是 checkout 默认分支，
      #    确保编译的正是这个 release 标记的源码版本
      - name: 下载 Release 源码 (Source code zip)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN" }
          $zipUrl = "${{ steps.release.outputs.zipball_url }}"

          Invoke-WebRequest -Uri $zipUrl -Headers $headers -OutFile "source.zip"

          $extractDir = Join-Path $env:GITHUB_WORKSPACE "extracted"
          Expand-Archive -Path "source.zip" -DestinationPath $extractDir -Force

          # GitHub 生成的 zip 内是单一顶层目录（如 June6699-dart_simple_live-<sha>）
          $srcDir = Get-ChildItem -Path $extractDir -Directory | Select-Object -First 1
          if (-not $srcDir) {
            throw "解压后未找到源码目录"
          }
          Write-Host "解压得到目录: $($srcDir.FullName)"

          $targetDir = Join-Path $env:GITHUB_WORKSPACE "upstream-src"
          Move-Item -Path $srcDir.FullName -Destination $targetDir -Force

          if (-not (Test-Path (Join-Path $targetDir "simple_live_app"))) {
            throw "移动后未找到 upstream-src/simple_live_app，目录结构可能与预期不符: $targetDir"
          }
          Write-Host "源码已就位: $targetDir"

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version }}
          channel: "stable"
          cache: true

      - name: 启用 Windows 桌面支持
        run: flutter config --enable-windows-desktop

      # 3. 编译 Windows 端（主 App 在 simple_live_app 子目录）
      - name: 获取依赖
        working-directory: ${{ github.workspace }}/upstream-src/simple_live_app
        run: flutter pub get

      - name: 编译 Windows Release
        working-directory: ${{ github.workspace }}/upstream-src/simple_live_app
        env:
          # 部分第三方插件（如 flutter_inappwebview_windows）仍在使用已被新版 MSVC
          # 标记为废弃/报错的 <experimental/coroutine>，这里临时压制该错误以保证可编译。
          # 若插件后续更新修复了该问题，可以去掉这个环境变量。
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release

      # 4. 定位编译产物，动态探测 exe 名称，避免硬编码
      - name: 定位编译产物
        id: locate
        shell: pwsh
        run: |
          $winBuildPath = Join-Path $env:GITHUB_WORKSPACE "upstream-src\simple_live_app\build\windows"
          $releaseDir = Get-ChildItem -Path $winBuildPath -Recurse -Directory |
            Where-Object { $_.Name -eq "Release" -and $_.FullName -match "runner" } |
            Select-Object -First 1

          if (-not $releaseDir) {
            throw "未找到 build/windows/*/runner/Release 目录，编译产物路径可能已变化"
          }

          $exe = Get-ChildItem -Path $releaseDir.FullName -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "未在 Release 目录中找到 exe 文件"
          }

          $exeName = $exe.Name
          $appName = [System.IO.Path]::GetFileNameWithoutExtension($exeName)

          echo "release_dir=$($releaseDir.FullName)" >> $env:GITHUB_OUTPUT
          echo "exe_name=$exeName" >> $env:GITHUB_OUTPUT
          echo "app_name=$appName" >> $env:GITHUB_OUTPUT
          Write-Host "发布目录: $($releaseDir.FullName)"
          Write-Host "可执行文件: $exeName"

      # 5. 安装 Inno Setup 并生成安装包
      - name: 安装 Inno Setup
        run: choco install innosetup -y

      - name: 下载简体中文语言包
        id: zhlang
        shell: pwsh
        run: |
          $langDir = "C:\Program Files (x86)\Inno Setup 6\Languages"
          if (-not (Test-Path $langDir)) {
            New-Item -ItemType Directory -Force -Path $langDir | Out-Null
          }
          $url = "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl"
          $dest = Join-Path $langDir "ChineseSimplified.isl"

          try {
            Invoke-WebRequest -Uri $url -OutFile $dest -ErrorAction Stop
            if ((Test-Path $dest) -and ((Get-Item $dest).Length -gt 0)) {
              Write-Host "简体中文语言包已就位: $dest"
              echo "available=true" >> $env:GITHUB_OUTPUT
            } else {
              throw "下载后文件为空"
            }
          } catch {
            Write-Warning "简体中文语言包下载失败，安装向导将回退为仅英文: $_"
            echo "available=false" >> $env:GITHUB_OUTPUT
          }

      - name: 生成 Inno Setup 脚本
        id: iss
        shell: pwsh
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          # 版本号去掉前缀 v，Inno Setup 的 AppVersion 建议使用纯数字风格但也可接受任意字符串
          $version = $tag -replace '^v', ''
          $releaseDir = "${{ steps.locate.outputs.release_dir }}"
          $exeName = "${{ steps.locate.outputs.exe_name }}"
          $appName = "SimpleLive"
          $outputDir = "$env:GITHUB_WORKSPACE\installer_output"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null

          $zhAvailable = "${{ steps.zhlang.outputs.available }}" -eq "true"

          $issLines = @(
            "[Setup]",
            "AppId={{B6C1D6C4-9F2E-4B7A-9E3D-SIMPLELIVE001}}",
            "AppName=$appName",
            "AppVersion=$version",
            "AppPublisher=SimpleLive",
            "DefaultDirName={autopf}\$appName",
            "DefaultGroupName=$appName",
            "DisableProgramGroupPage=yes",
            "OutputDir=$outputDir",
            "OutputBaseFilename=SimpleLive-Windows-Setup-$tag",
            "Compression=lzma",
            "SolidCompression=yes",
            "WizardStyle=modern",
            "ArchitecturesAllowed=x64compatible",
            "ArchitecturesInstallIn64BitMode=x64compatible",
            "UninstallDisplayIcon={app}\$exeName",
            "",
            "[Languages]"
          )

          if ($zhAvailable) {
            $issLines += 'Name: "chinesesimplified"; MessagesFile: "compiler:Languages\ChineseSimplified.isl"'
          }
          $issLines += 'Name: "english"; MessagesFile: "compiler:Default.isl"'

          $issLines += @(
            "",
            "[Tasks]",
            ('Name: "desktopicon"; Description: "' + $(if ($zhAvailable) { "创建桌面快捷方式" } else { "Create a desktop shortcut" }) + '"; GroupDescription: "' + $(if ($zhAvailable) { "附加图标:" } else { "Additional icons:" }) + '"'),
            "",
            "[Files]",
            "Source: `"$releaseDir\*`"; DestDir: `"{app}`"; Flags: ignoreversion recursesubdirs createallsubdirs",
            "",
            "[Icons]",
            "Name: `"{group}\$appName`"; Filename: `"{app}\$exeName`"",
            "Name: `"{autodesktop}\$appName`"; Filename: `"{app}\$exeName`"; Tasks: desktopicon",
            "",
            "[Run]",
            ('Filename: "{app}\' + $exeName + '"; Description: "' + $(if ($zhAvailable) { "启动 $appName" } else { "Launch $appName" }) + '"; Flags: nowait postinstall skipifsilent')
          )
          $issContent = $issLines -join "`r`n"

          $issPath = "$env:GITHUB_WORKSPACE\installer.iss"
          Set-Content -Path $issPath -Value $issContent -Encoding UTF8
          echo "iss_path=$issPath" >> $env:GITHUB_OUTPUT
          echo "output_dir=$outputDir" >> $env:GITHUB_OUTPUT
          echo "installer_name=SimpleLive-Windows-Setup-$tag.exe" >> $env:GITHUB_OUTPUT

      - name: 编译安装包
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "${{ steps.iss.outputs.iss_path }}"

      - name: 校验安装包已生成
        shell: pwsh
        run: |
          $path = "${{ steps.iss.outputs.output_dir }}\${{ steps.iss.outputs.installer_name }}"
          if (-not (Test-Path $path)) {
            throw "安装包未生成: $path"
          }
          Write-Host "安装包已生成: $path"

      # 6. 发布安装包到【当前仓库】的 release，tag 沿用源仓库的版本号
      #    若当前仓库还没有这个 tag 对应的 release，则自动创建一个
      - name: 发布/上传安装包到本仓库 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          SOURCE_REPO: ${{ env.SOURCE_REPO }}
          SOURCE_RELEASE_URL: ${{ steps.release.outputs.source_release_url }}
        run: |
          set -e
          ASSET_NAME="${{ steps.iss.outputs.installer_name }}"
          ASSET_PATH="${{ steps.iss.outputs.output_dir }}/${{ steps.iss.outputs.installer_name }}"

          # 检查本仓库是否已存在该 tag 的 release，不存在则创建
          # （若本仓库连该 tag 本身都没有，gh release create 会基于默认分支自动打一个新 tag）
          if ! gh api "repos/$REPO/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "本仓库尚无 tag=$TAG 的 release，正在创建..."
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "$TAG" \
              --notes "自动构建自源仓库 $SOURCE_REPO 的 $TAG 版本 Windows 安装包。源 release: $SOURCE_RELEASE_URL"
          else
            echo "本仓库已存在 tag=$TAG 的 release，将直接上传/覆盖资产"
          fi

          # 若已存在同名资产，--clobber 会自动覆盖，这里不需要手动删除
          gh release upload "$TAG" "$ASSET_PATH" --repo "$REPO" --clobber

          echo "已上传: $ASSET_NAME 到本仓库 ($REPO) release $TAG"
