name: Build Android arm64 APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "上游仓库的 Git ref（branch/tag/commit），默认拉取最新 master"
        required: false
        default: "master"
      release_tag:
        description: "发布的 Release tag 名称，例如 v1.12.1-arm64（留空则不创建 Release）"
        required: false
        default: ""

jobs:
  build-android-arm64:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      # ── 1. 拉取上游源码 ──────────────────────────────────────────────
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: June6699/dart_simple_live
          ref: ${{ inputs.ref }}
          path: source

      # ── 2. 签名（可选）────────────────────────────────────────────────
      # 如果你在仓库 Settings → Secrets 里配置了以下四个 Secret，就会用你的
      # 签名证书；否则自动回退到 debug 签名（APK 仍可安装，但每次重装需卸载旧版）。
      #
      #   KEYSTORE_BASE64   — keystore 文件的 base64 编码（见下方说明）
      #   STORE_PASSWORD    — keystore 密码
      #   KEY_ALIAS         — key 别名
      #   KEY_PASSWORD      — key 密码
      #
      # 生成 base64：base64 -w 0 your.keystore > keystore.b64
      - name: Prepare Android keystore (optional)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_PASSWORD" && -n "$KEY_ALIAS" ]]; then
            echo "✅ Release keystore detected, using release signing."
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > source/simple_live_app/android/release-keystore.jks
            printf 'storeFile=../release-keystore.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" \
              > source/simple_live_app/android/key.properties
          else
            echo "⚠️  No keystore secrets found, will fall back to debug signing."
          fi

      # ── 3. 环境准备 ────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.x"
          cache: true

      # ── 4. 依赖安装 ────────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          cd source/simple_live_app
          flutter pub get

      # ── 5. 读取版本号 ──────────────────────────────────────────────────
      - name: Read app version
        id: app_version
        run: |
          ver=$(grep '^version:' source/simple_live_app/pubspec.yaml | awk '{print $2}')
          echo "app_version=$ver" >> "$GITHUB_OUTPUT"
          echo "App version: $ver"

      # ── 6. 编译 arm64-v8a APK ──────────────────────────────────────────
      - name: Build arm64-v8a APK
        run: |
          cd source/simple_live_app
          flutter build apk --release \
            --split-per-abi \
            --target-platform android-arm64

      # ── 7. 重命名产物 ──────────────────────────────────────────────────
      - name: Rename APK
        id: apk
        run: |
          src="source/simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          dst="SimpleLive-${{ steps.app_version.outputs.app_version }}-arm64.apk"
          cp "$src" "$dst"
          echo "apk_path=$dst" >> "$GITHUB_OUTPUT"
          echo "APK: $dst  ($(du -sh "$dst" | cut -f1))"

      # ── 8. 上传到 Artifacts（无论是否发 Release 都保留） ───────────────
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-arm64
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30

      # ── 9. 创建 / 更新 GitHub Release（仅当填写了 release_tag 时） ─────
      - name: Publish GitHub Release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          body: |
            ## SimpleLive Android arm64 Build

            - 上游版本：`${{ steps.app_version.outputs.app_version }}`
            - 上游 ref：`${{ inputs.ref }}`
            - 架构：`arm64-v8a`
            - 构建时间：${{ github.event.head_commit.timestamp || 'manual trigger' }}

            > 由 GitHub Actions 自动从 [June6699/dart_simple_live](https://github.com/June6699/dart_simple_live) 编译。
          generate_release_notes: false
          prerelease: ${{ contains(inputs.release_tag, 'beta') || contains(inputs.release_tag, 'alpha') || contains(inputs.release_tag, 'pre') }}
          token: ${{ github.token }}
          files: ${{ steps.apk.outputs.apk_path }}
