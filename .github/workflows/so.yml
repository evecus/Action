name: Extract MPV AAR from media-kit

on:
  workflow_dispatch:
    inputs:
      media_kit_version:
        description: 'media_kit_libs_android_video version (leave blank for latest)'
        required: false
        default: ''

jobs:
  extract-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Determine package version
        id: version
        run: |
          if [ -z "${{ github.event.inputs.media_kit_version }}" ]; then
            VERSION=$(curl -s "https://pub.dev/api/packages/media_kit_libs_android_video" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['latest']['version'])")
          else
            VERSION="${{ github.event.inputs.media_kit_version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      - name: Create Flutter dummy project
        run: |
          flutter create --platforms=android dummy_project

      - name: Add media_kit dependency to pubspec.yaml
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd dummy_project
          python3 << PYEOF
          import re
          version = "${VERSION}"
          with open("pubspec.yaml", "r") as f:
              content = f.read()
          new_dep = "\n  media_kit_libs_android_video: ^" + version
          content = re.sub(r"(^dependencies:\s*$)", r"\1" + new_dep, content, flags=re.MULTILINE)
          with open("pubspec.yaml", "w") as f:
              f.write(content)
          print("Updated pubspec.yaml:")
          print(content)
          PYEOF

      - name: Fetch packages
        run: |
          cd dummy_project
          flutter pub get

      - name: Find all .so files in pub cache
        run: |
          PUB_CACHE="${HOME}/.pub-cache"
          echo "=== pub cache 目录结构 ==="
          ls "$PUB_CACHE/hosted/pub.dev/" | grep media_kit || echo "未找到 media_kit 相关目录"

          echo ""
          echo "=== 所有 media_kit 相关目录 ==="
          find "$PUB_CACHE" -type d -name "*media_kit*" 2>/dev/null

          echo ""
          echo "=== 所有 .so 文件 ==="
          find "$PUB_CACHE" -name "*.so" 2>/dev/null | sort

          echo ""
          echo "=== 所有 .aar 文件 ==="
          find "$PUB_CACHE" -name "*.aar" 2>/dev/null | sort

          echo ""
          echo "=== media_kit_libs_android_video 完整目录树 ==="
          PKG_DIR=$(find "$PUB_CACHE" -type d -name "media_kit_libs_android_video-*" 2>/dev/null | head -1)
          if [ -n "$PKG_DIR" ]; then
            find "$PKG_DIR" | sort
          else
            echo "未找到包目录"
          fi

      - name: Find .so in Flutter engine and build cache
        run: |
          echo "=== dummy_project/.dart_tool ==="
          find dummy_project/.dart_tool -name "*.so" 2>/dev/null | sort || echo "无"

          echo ""
          echo "=== dummy_project/android ==="
          find dummy_project/android -name "*.so" 2>/dev/null | sort || echo "无"

          echo ""
          echo "=== /root/.gradle (gradle cache) ==="
          find /root/.gradle -name "*.so" 2>/dev/null | sort | head -30 || echo "无"

          echo ""
          echo "=== 全局搜索 libmpv ==="
          find / -name "libmpv*" 2>/dev/null | grep -v proc | sort || echo "无"

      - name: Build Flutter Android (trigger download of native libs)
        run: |
          cd dummy_project
          # 触发 gradle 下载，这会拉取 .so 文件到 gradle 缓存
          cd android
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tail -30 || true

      - name: Find .so files after build
        id: locate
        run: |
          echo "=== Build 后搜索所有 .so ==="
          find /root -name "libmpv*.so" 2>/dev/null | sort
          find /home -name "libmpv*.so" 2>/dev/null | sort
          find /tmp -name "libmpv*.so" 2>/dev/null | sort

          echo ""
          echo "=== 搜索 libc++_shared.so ==="
          find /root -name "libc++_shared.so" 2>/dev/null | sort | head -10

          echo ""
          echo "=== gradle 缓存中的 .so ==="
          find /root/.gradle -name "*.so" 2>/dev/null | sort | head -50

          echo ""
          echo "=== dummy_project 全部 .so ==="
          find dummy_project -name "*.so" 2>/dev/null | sort

          # 找到 libmpv.so 所在目录作为基准
          MPV_SO=$(find / -name "libmpv.so" 2>/dev/null | grep -v proc | head -1)
          if [ -n "$MPV_SO" ]; then
            MPV_DIR=$(dirname "$MPV_SO")
            echo "pkg_dir=$MPV_DIR" >> $GITHUB_OUTPUT
            echo "找到 libmpv.so: $MPV_SO"
          else
            echo "pkg_dir=" >> $GITHUB_OUTPUT
            echo "未找到 libmpv.so"
          fi

      - name: Build AAR
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          AAR_NAME="mpv-android-${VERSION}"
          WORK_DIR="/tmp/aar_build/${AAR_NAME}"

          mkdir -p "${WORK_DIR}/jni/arm64-v8a"
          mkdir -p "${WORK_DIR}/jni/armeabi-v7a"

          # 搜索所有 ABI 目录下的 .so，复制到 AAR 结构
          for ABI in arm64-v8a armeabi-v7a; do
            find / -path "*/${ABI}/*.so" ! -path "*/proc/*" ! -path "*/flutter_tools/*" 2>/dev/null | while read f; do
              echo "Copying [$ABI]: $f"
              cp "$f" "${WORK_DIR}/jni/${ABI}/" 2>/dev/null || true
            done
          done

          echo "=== 复制结果 ==="
          find "${WORK_DIR}/jni" -name "*.so" | sort

          cat > "${WORK_DIR}/AndroidManifest.xml" << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="is.xyz.mpv">
          </manifest>
          MANIFEST

          touch "${WORK_DIR}/R.txt"
          mkdir -p /tmp/empty_classes
          cd /tmp/empty_classes
          zip -r "${WORK_DIR}/classes.jar" . 2>/dev/null || touch "${WORK_DIR}/classes.jar"

          cd "${WORK_DIR}"
          zip -r "/tmp/${AAR_NAME}.aar" .

          echo "=== 最终 AAR 内容 ==="
          unzip -l "/tmp/${AAR_NAME}.aar"
          echo "AAR size: $(du -h /tmp/${AAR_NAME}.aar | cut -f1)"

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpv-android-${{ steps.version.outputs.version }}
          path: /tmp/mpv-android-${{ steps.version.outputs.version }}.aar
          retention-days: 30

      - name: Upload full build dir (debug)
        uses: actions/upload-artifact@v4
        with:
          name: mpv-so-files-${{ steps.version.outputs.version }}
          path: /tmp/aar_build/
          retention-days: 30
