name: Extract MPV AAR from media-kit

on:
  workflow_dispatch:
    inputs:
      media_kit_version:
        description: 'media_kit_libs_android_video version (leave blank for latest)'
        required: false
        default: ''

jobs:
  extract-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Determine package version
        id: version
        run: |
          if [ -z "${{ github.event.inputs.media_kit_version }}" ]; then
            VERSION=$(curl -s "https://pub.dev/api/packages/media_kit_libs_android_video" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['latest']['version'])")
          else
            VERSION="${{ github.event.inputs.media_kit_version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using media_kit_libs_android_video version: $VERSION"

      - name: Create Flutter dummy project
        run: |
          flutter create --platforms=android dummy_project

      - name: Add media_kit dependency to pubspec.yaml
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd dummy_project
          # 用 python 精确插入到 dependencies: 节点下
          python3 << PYEOF
          import re
          version = "${VERSION}"
          with open("pubspec.yaml", "r") as f:
              content = f.read()
          new_dep = "\n  media_kit_libs_android_video: ^" + version
          content = re.sub(r"(^dependencies:\s*$)", r"\1" + new_dep, content, flags=re.MULTILINE)
          with open("pubspec.yaml", "w") as f:
              f.write(content)
          print("Updated pubspec.yaml:")
          print(content)
          PYEOF

      - name: Fetch media_kit_libs_android_video
        run: |
          cd dummy_project
          flutter pub get

      - name: Locate .so files
        id: locate
        run: |
          PUB_CACHE="${HOME}/.pub-cache"
          PKG_DIR=$(find "$PUB_CACHE" -type d -name "media_kit_libs_android_video-*" 2>/dev/null | head -1)
          echo "pkg_dir=$PKG_DIR" >> $GITHUB_OUTPUT
          echo "Found package at: $PKG_DIR"
          echo "=== .so files found ==="
          find "$PKG_DIR" -name "*.so" 2>/dev/null | sort

      - name: Build AAR
        run: |
          PKG_DIR="${{ steps.locate.outputs.pkg_dir }}"
          VERSION="${{ steps.version.outputs.version }}"
          AAR_NAME="mpv-android-${VERSION}"
          WORK_DIR="/tmp/aar_build/${AAR_NAME}"

          mkdir -p "${WORK_DIR}/jni/arm64-v8a"
          mkdir -p "${WORK_DIR}/jni/armeabi-v7a"

          for ABI in arm64-v8a armeabi-v7a; do
            find "${PKG_DIR}" -path "*/${ABI}/*.so" | while read f; do
              echo "Copying: $f"
              cp "$f" "${WORK_DIR}/jni/${ABI}/"
            done
          done

          cat > "${WORK_DIR}/AndroidManifest.xml" << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="is.xyz.mpv">
          </manifest>
          MANIFEST

          touch "${WORK_DIR}/R.txt"

          # 创建空 classes.jar
          mkdir -p /tmp/empty_classes
          cd /tmp/empty_classes
          zip -r "${WORK_DIR}/classes.jar" . 2>/dev/null || touch "${WORK_DIR}/classes.jar"

          cd "${WORK_DIR}"
          zip -r "/tmp/${AAR_NAME}.aar" .

          echo "=== AAR 内容 ==="
          unzip -l "/tmp/${AAR_NAME}.aar"
          echo "=== AAR 大小 ==="
          du -h "/tmp/${AAR_NAME}.aar"

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpv-android-${{ steps.version.outputs.version }}
          path: /tmp/mpv-android-${{ steps.version.outputs.version }}.aar
          retention-days: 30

      - name: Upload .so files (backup)
        uses: actions/upload-artifact@v4
        with:
          name: mpv-so-files-${{ steps.version.outputs.version }}
          path: /tmp/aar_build/
          retention-days: 30

      - name: Summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "## ✅ MPV AAR 打包完成" >> $GITHUB_STEP_SUMMARY
          echo "**版本**: media_kit_libs_android_video ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 包含的 .so 文件" >> $GITHUB_STEP_SUMMARY
          unzip -l "/tmp/mpv-android-${VERSION}.aar" | grep "\.so" | awk '{print "- `" $4 "`"}' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 使用方法" >> $GITHUB_STEP_SUMMARY
          echo "1. 下载 artifact \`mpv-android-${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "2. 将 \`mpv-android-${VERSION}.aar\` 放到 \`app/libs/\`" >> $GITHUB_STEP_SUMMARY
          echo "3. 删除 \`build.gradle\` 中 \`implementation 'com.github.mpv-android:mpv-android:n20231205'\`" >> $GITHUB_STEP_SUMMARY
