name: Decompile Go Binary

on:
  workflow_dispatch:
    inputs:
      binary_url:
        description: "Direct download URL of the Go binary"
        required: false
        default: ""
      binary_path:
        description: "Path to binary in this repo (leave empty if using URL)"
        required: false
        default: ""
      strip_level:
        description: "Expected strip level: full (symbols intact) / stripped"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - stripped

jobs:
  decompile:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      # ── 1. Checkout (needed if binary is in the repo) ──────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Download binary (URL mode) ──────────────────────────────────
      - name: Download binary from URL
        if: ${{ inputs.binary_url != '' }}
        run: |
          mkdir -p target
          curl -fsSL "${{ inputs.binary_url }}" -o target/binary
          chmod +x target/binary

      # ── 3. Copy binary from repo path ──────────────────────────────────
      - name: Copy binary from repo
        if: ${{ inputs.binary_url == '' && inputs.binary_path != '' }}
        run: |
          mkdir -p target
          cp "${{ inputs.binary_path }}" target/binary
          chmod +x target/binary

      # ── 4. Sanity check ────────────────────────────────────────────────
      - name: Inspect binary
        run: |
          file target/binary
          ls -lh target/binary
          go version -m target/binary 2>/dev/null || echo "[!] No Go build info (binary may be stripped)"

      # ── 5. Install system dependencies ────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            openjdk-17-jdk-headless \
            binutils \
            python3 \
            curl \
            unzip \
            git

      # ── 6. Install GoReSym (clone + build) ────────────────────────────
      #    GoReSym uses non-semver tags (e.g. "v3.2" not "v3.2.0") so
      #    `go install @v3.2` fails. Clone the latest tag and build instead.
      - name: Install GoReSym
        run: |
          # Fetch the exact latest tag name dynamically
          GORESYM_TAG=$(git ls-remote --tags --sort="-v:refname" \
            https://github.com/mandiant/GoReSym.git \
            | grep -oP 'refs/tags/\Kv[0-9]+\.[0-9]+(\.[0-9]+)?$' \
            | head -1)
          echo "Latest GoReSym tag: ${GORESYM_TAG}"

          git clone --depth 1 --branch "${GORESYM_TAG}" \
            https://github.com/mandiant/GoReSym.git /tmp/GoReSym

          cd /tmp/GoReSym
          go build -o /usr/local/bin/goresym .
          goresym -about 2>/dev/null || echo "GoReSym installed OK"

      # ── 7. Run GoReSym ─────────────────────────────────────────────────
      - name: Run GoReSym
        run: |
          mkdir -p output/goresym
          # -d  include standard library functions
          # -p  include source file paths
          # -t  include type information
          goresym -d -p -t target/binary > output/goresym/symbols.json 2>&1 || true

          echo "--- GoReSym summary ---"
          python3 - <<'EOF'
          import json, sys
          try:
              data = json.load(open("output/goresym/symbols.json"))
              funcs = data.get("UserFunctions", []) + data.get("StdFunctions", [])
              print(f"Total functions recovered : {len(funcs)}")
              pkgs = {f['PackageName'] for f in funcs if f.get('PackageName')}
              print(f"Distinct packages         : {len(pkgs)}")
              for p in sorted(pkgs)[:30]:
                  print(f"  {p}")
              if len(pkgs) > 30:
                  print(f"  ... and {len(pkgs)-30} more")
          except Exception as e:
              print(f"Could not parse symbols.json: {e}")
              print("First 500 chars of output:")
              print(open("output/goresym/symbols.json").read()[:500])
          EOF

      # ── 8. Extract strings ─────────────────────────────────────────────
      - name: Extract strings
        run: |
          mkdir -p output/strings
          strings -n 6 target/binary > output/strings/all_strings.txt
          echo "Total strings: $(wc -l < output/strings/all_strings.txt)"
          grep -E '\.go:|/go/src|github\.com|golang\.org' \
            output/strings/all_strings.txt \
            > output/strings/source_hints.txt || true
          echo "Source path hints: $(wc -l < output/strings/source_hints.txt)"

      # ── 9. Cache & install Ghidra 11.3 ────────────────────────────────
      - name: Cache Ghidra
        id: cache-ghidra
        uses: actions/cache@v4
        with:
          path: ~/ghidra
          key: ghidra-11.3

      - name: Download Ghidra 11.3
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: |
          curl -fsSL \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.3_build/ghidra_11.3_PUBLIC_20250205.zip" \
            -o /tmp/ghidra.zip
          unzip -q /tmp/ghidra.zip -d ~/
          mv ~/ghidra_11.3_PUBLIC ~/ghidra
          echo "Ghidra installed: $(ls ~/ghidra)"

      # ── 10. Write Ghidra decompiler script ────────────────────────────
      - name: Write Ghidra post-analysis script
        run: |
          mkdir -p /tmp/ghidra_scripts
          cat > /tmp/ghidra_scripts/ExportDecompiled.java << 'JAVAEOF'
          // Ghidra headless post-analysis script (Java)
          // Exports decompiled C pseudocode, one file per namespace/package.
          //@category Analysis

          import ghidra.app.decompiler.DecompInterface;
          import ghidra.app.decompiler.DecompileResults;
          import ghidra.app.script.GhidraScript;
          import ghidra.program.model.listing.Function;
          import ghidra.program.model.listing.FunctionIterator;
          import ghidra.util.task.ConsoleTaskMonitor;
          import java.io.*;
          import java.nio.file.*;
          import java.util.*;

          public class ExportDecompiled extends GhidraScript {
              @Override
              public void run() throws Exception {
                  String outDir = "/tmp/ghidra_out";
                  Files.createDirectories(Paths.get(outDir));

                  DecompInterface decompiler = new DecompInterface();
                  decompiler.openProgram(currentProgram);

                  FunctionIterator funcs = currentProgram.getListing()
                      .getFunctions(true);

                  Map<String, StringBuilder> pkgFiles = new LinkedHashMap<>();
                  int total = 0, failed = 0;

                  while (funcs.hasNext()) {
                      Function fn = funcs.next();
                      String name = fn.getName();
                      String ns   = fn.getParentNamespace().getName(true);
                      String key  = (ns == null || ns.isEmpty()) ? "unknown" : ns;

                      DecompileResults res = decompiler.decompileFunction(
                          fn, 30, new ConsoleTaskMonitor());

                      String code;
                      if (res != null && res.getDecompiledFunction() != null) {
                          code = res.getDecompiledFunction().getC();
                      } else {
                          code = "/* decompilation failed: " + name + " */\n";
                          failed++;
                      }

                      pkgFiles.computeIfAbsent(key, k -> new StringBuilder())
                          .append("// ── ").append(name).append(" ──\n")
                          .append(code).append("\n");
                      total++;
                  }

                  for (Map.Entry<String, StringBuilder> e : pkgFiles.entrySet()) {
                      String safe = e.getKey()
                          .replace("/", "__")
                          .replace("::", "__")
                          .replaceAll("[^a-zA-Z0-9._\\-]", "_");
                      Path p = Paths.get(outDir, safe + ".c");
                      Files.writeString(p, e.getValue().toString());
                  }

                  println("Functions total  : " + total);
                  println("Decompile failed : " + failed);
                  println("Output files     : " + pkgFiles.size());
                  decompiler.dispose();
              }
          }
          JAVAEOF

      # ── 11. Run Ghidra headless analysis ──────────────────────────────
      - name: Run Ghidra headless analysis
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          mkdir -p output/ghidra /tmp/ghidra_project /tmp/ghidra_out

          ~/ghidra/support/analyzeHeadless \
            /tmp/ghidra_project GoDecompile \
            -import target/binary \
            -postScript ExportDecompiled.java \
            -scriptPath /tmp/ghidra_scripts \
            -log /tmp/ghidra_analysis.log \
            -overwrite \
            2>&1 | tail -50 || true

          # Copy output into workspace
          if ls /tmp/ghidra_out/*.c 1>/dev/null 2>&1; then
            cp /tmp/ghidra_out/*.c output/ghidra/
            echo "Ghidra output files: $(ls output/ghidra/*.c | wc -l)"
          else
            echo "[!] No .c files produced — check ghidra log"
            tail -30 /tmp/ghidra_analysis.log || true
          fi

          # Always save the full Ghidra log
          cp /tmp/ghidra_analysis.log output/ghidra_analysis.log 2>/dev/null || true

      # ── 12. Generate summary report ───────────────────────────────────
      - name: Generate summary report
        run: |
          python3 - << 'EOF'
          import json, os, glob, subprocess

          lines = ["# Go Binary Decompilation Report\n\n"]

          # Binary info
          r = subprocess.run(["file", "target/binary"], capture_output=True, text=True)
          lines.append("## Binary Info\n```\n" + r.stdout.strip() + "\n```\n\n")

          r2 = subprocess.run(["go", "version", "-m", "target/binary"],
                               capture_output=True, text=True)
          if r2.returncode == 0:
              lines.append("## Go Build Metadata\n```\n" + r2.stdout.strip() + "\n```\n\n")
          else:
              lines.append("## Go Build Metadata\n> Not available (binary may be stripped)\n\n")

          # GoReSym results
          try:
              data = json.load(open("output/goresym/symbols.json"))
              funcs = data.get("UserFunctions", []) + data.get("StdFunctions", [])
              pkgs  = sorted({f['PackageName'] for f in funcs if f.get('PackageName')})
              lines.append(f"## GoReSym Results\n")
              lines.append(f"- Functions recovered: **{len(funcs)}**\n")
              lines.append(f"- Packages detected: **{len(pkgs)}**\n\n")
              lines.append("### Package List\n```\n" + "\n".join(pkgs) + "\n```\n\n")

              user = sorted(data.get("UserFunctions", []),
                            key=lambda f: f.get('FullName', ''))
              if user:
                  lines.append("### User-defined Functions (first 50)\n```\n")
                  for f in user[:50]:
                      lines.append(f"  {f.get('FullName','?')}  @{f.get('Start','?')}\n")
                  lines.append("```\n\n")
          except Exception as e:
              lines.append(f"## GoReSym Results\n> Parse failed: {e}\n\n")

          # Source hints
          try:
              hints = open("output/strings/source_hints.txt").read().strip().splitlines()
              lines.append(f"## Source Path Hints ({len(hints)} found)\n```\n")
              for h in hints[:60]:
                  lines.append(h + "\n")
              if len(hints) > 60:
                  lines.append(f"... and {len(hints)-60} more\n")
              lines.append("```\n\n")
          except:
              pass

          # Ghidra output
          ghidra_files = glob.glob("output/ghidra/*.c")
          lines.append(f"## Ghidra Decompiled Files\n")
          lines.append(f"Total package files: **{len(ghidra_files)}**\n\n")
          for gf in sorted(ghidra_files)[:30]:
              sz = os.path.getsize(gf)
              lines.append(f"- `{os.path.basename(gf)}` ({sz:,} bytes)\n")

          with open("output/REPORT.md", "w") as f:
              f.writelines(lines)

          print("Report written to output/REPORT.md")
          EOF

      # ── 13. Print summary to Actions log ──────────────────────────────
      - name: Print summary
        run: |
          echo "=========================================="
          cat output/REPORT.md
          echo "=========================================="
          echo ""
          echo "Output structure:"
          find output -type f | sort

      # ── 14. Upload all results as artifact ────────────────────────────
      - name: Upload decompilation artifact
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-${{ github.run_id }}
          path: output/
          retention-days: 14
          if-no-files-found: warn
