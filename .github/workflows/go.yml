name: Decompile Go Binary

on:
  workflow_dispatch:
    inputs:
      binary_url:
        description: "Direct download URL of the Go binary"
        required: false
        default: ""
      binary_path:
        description: "Path to binary in this repo (leave empty if using URL)"
        required: false
        default: ""
      strip_level:
        description: "Expected strip level: full (symbols intact) / stripped"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - stripped

jobs:
  decompile:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      # ── 1. Checkout (needed if binary is in the repo) ──────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Download binary (URL mode) ──────────────────────────────────
      - name: Download binary from URL
        if: ${{ inputs.binary_url != '' }}
        run: |
          mkdir -p target
          curl -fsSL "${{ inputs.binary_url }}" -o target/binary
          chmod +x target/binary

      # ── 3. Copy binary from repo path ──────────────────────────────────
      - name: Copy binary from repo
        if: ${{ inputs.binary_url == '' && inputs.binary_path != '' }}
        run: |
          mkdir -p target
          cp "${{ inputs.binary_path }}" target/binary
          chmod +x target/binary

      # ── 4. Sanity check ────────────────────────────────────────────────
      - name: Inspect binary
        run: |
          file target/binary
          ls -lh target/binary
          # Print Go build info if available
          go version -m target/binary 2>/dev/null || echo "[!] No Go build info (binary may be stripped)"

      # ── 5. Install dependencies ────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            openjdk-17-jdk-headless \
            binutils \
            python3 \
            python3-pip \
            curl \
            unzip \
            git

      # ── 6. Restore symbol table with GoReSym ───────────────────────────
      #    GoReSym recovers function names, types, and source paths even
      #    when the binary was compiled with -ldflags="-s -w".
      - name: Install GoReSym
        run: |
          GORESYM_VER="2.7.5"
          curl -fsSL \
            "https://github.com/mandiant/GoReSym/releases/download/v${GORESYM_VER}/GoReSym_linux" \
            -o /usr/local/bin/goresym
          chmod +x /usr/local/bin/goresym

      - name: Run GoReSym
        run: |
          mkdir -p output/goresym
          goresym -d -p -t target/binary > output/goresym/symbols.json 2>&1 || true
          echo "--- GoReSym summary ---"
          python3 - <<'EOF'
          import json, sys
          try:
              data = json.load(open("output/goresym/symbols.json"))
              funcs = data.get("UserFunctions", []) + data.get("StdFunctions", [])
              print(f"Total functions recovered : {len(funcs)}")
              pkgs = {f['PackageName'] for f in funcs if f.get('PackageName')}
              print(f"Distinct packages         : {len(pkgs)}")
              for p in sorted(pkgs)[:30]:
                  print(f"  {p}")
              if len(pkgs) > 30:
                  print(f"  ... and {len(pkgs)-30} more")
          except Exception as e:
              print(f"Could not parse JSON: {e}")
          EOF

      # ── 7. Extract strings ─────────────────────────────────────────────
      - name: Extract strings
        run: |
          mkdir -p output/strings
          strings -n 6 target/binary > output/strings/all_strings.txt
          wc -l output/strings/all_strings.txt
          # Filter likely source paths
          grep -E '\.go:|/go/src|github\.com|golang\.org' \
            output/strings/all_strings.txt \
            > output/strings/source_hints.txt || true
          echo "Source path hints: $(wc -l < output/strings/source_hints.txt)"

      # ── 8. Install & run Ghidra headless ───────────────────────────────
      - name: Cache Ghidra
        id: cache-ghidra
        uses: actions/cache@v4
        with:
          path: ~/ghidra
          key: ghidra-11.1.2

      - name: Download Ghidra
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: |
          GHIDRA_VER="11.1.2"
          GHIDRA_DATE="20240709"
          curl -fsSL \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VER}_build/ghidra_${GHIDRA_VER}_PUBLIC_${GHIDRA_DATE}.zip" \
            -o /tmp/ghidra.zip
          unzip -q /tmp/ghidra.zip -d ~/
          mv ~/ghidra_${GHIDRA_VER}_PUBLIC ~/ghidra

      - name: Write Ghidra post-analysis script
        run: |
          cat > /tmp/export_decompiled.py << 'PYEOF'
          # Ghidra headless post-analysis script
          # Exports decompiled C-like pseudocode for every function.
          import os
          from ghidra.app.decompiler import DecompInterface
          from ghidra.util.task import ConsoleTaskMonitor

          out_dir = "/tmp/ghidra_out"
          os.makedirs(out_dir, exist_ok=True)

          iface = DecompInterface()
          iface.openProgram(currentProgram)
          monitor = ConsoleTaskMonitor()

          funcs = list(currentProgram.getFunctionManager().getFunctions(True))
          print("Total functions: {}".format(len(funcs)))

          pkg_files = {}

          for fn in funcs:
              name = fn.getName()
              ns   = fn.getParentNamespace().getName(True)  # full package path
              key  = ns if ns else "unknown"

              result = iface.decompileFunction(fn, 30, monitor)
              if result and result.getDecompiledFunction():
                  code = result.getDecompiledFunction().getC()
              else:
                  code = "/* decompilation failed for {} */\n".format(name)

              if key not in pkg_files:
                  pkg_files[key] = []
              pkg_files[key].append("// Function: {}\n{}\n".format(name, code))

          for pkg, snippets in pkg_files.items():
              safe = pkg.replace("/", "__").replace("::", "__")
              path = os.path.join(out_dir, safe + ".c")
              with open(path, "w") as f:
                  f.write("\n".join(snippets))

          print("Wrote {} package files".format(len(pkg_files)))
          PYEOF

      - name: Run Ghidra headless analysis
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          mkdir -p output/ghidra /tmp/ghidra_project /tmp/ghidra_out

          ~/ghidra/support/analyzeHeadless \
            /tmp/ghidra_project GoDecompile \
            -import target/binary \
            -postScript /tmp/export_decompiled.py \
            -scriptPath /tmp \
            -log /tmp/ghidra_analysis.log \
            -overwrite \
            2>&1 | tail -40 || true

          # Move output into workspace
          cp -r /tmp/ghidra_out/. output/ghidra/ 2>/dev/null || true
          echo "Ghidra output files: $(ls output/ghidra | wc -l)"

      # ── 9. Generate human-readable summary ────────────────────────────
      - name: Generate summary report
        run: |
          python3 - << 'EOF'
          import json, os, glob

          lines = ["# Go Binary Decompilation Report\n"]

          # --- Binary info ---
          import subprocess
          r = subprocess.run(["file", "target/binary"], capture_output=True, text=True)
          lines.append("## Binary Info\n```\n" + r.stdout.strip() + "\n```\n")

          r2 = subprocess.run(["go", "version", "-m", "target/binary"],
                              capture_output=True, text=True)
          if r2.returncode == 0:
              lines.append("## Go Build Metadata\n```\n" + r2.stdout.strip() + "\n```\n")

          # --- GoReSym ---
          try:
              data = json.load(open("output/goresym/symbols.json"))
              funcs = data.get("UserFunctions", []) + data.get("StdFunctions", [])
              pkgs  = sorted({f['PackageName'] for f in funcs if f.get('PackageName')})
              lines.append(f"## GoReSym: Recovered Symbols\n")
              lines.append(f"- **Functions recovered**: {len(funcs)}\n")
              lines.append(f"- **Packages**: {len(pkgs)}\n")
              lines.append("\n### Package List\n```\n" + "\n".join(pkgs) + "\n```\n")

              # Top 20 functions by name length (usually most interesting)
              user = sorted(data.get("UserFunctions", []),
                            key=lambda f: f.get('FullName',''), )
              lines.append("\n### User-defined Functions (first 50)\n```\n")
              for f in user[:50]:
                  lines.append(f"  {f.get('FullName','?')}  @{f.get('Start','?')}\n")
              lines.append("```\n")
          except Exception as e:
              lines.append(f"## GoReSym\nFailed: {e}\n")

          # --- Source hints ---
          try:
              hints = open("output/strings/source_hints.txt").read().strip().splitlines()
              lines.append(f"\n## Source Path Hints ({len(hints)} found)\n```\n")
              for h in hints[:60]:
                  lines.append(h + "\n")
              lines.append("```\n")
          except:
              pass

          # --- Ghidra output ---
          ghidra_files = glob.glob("output/ghidra/*.c")
          lines.append(f"\n## Ghidra Decompiled Files\n")
          lines.append(f"{len(ghidra_files)} package files generated.\n")
          for gf in sorted(ghidra_files)[:20]:
              sz = os.path.getsize(gf)
              lines.append(f"- `{os.path.basename(gf)}` ({sz} bytes)\n")

          with open("output/REPORT.md", "w") as f:
              f.writelines(lines)

          print("Report written.")
          EOF

      # ── 10. Print summary to Actions log ──────────────────────────────
      - name: Print summary
        run: |
          echo "=========================================="
          cat output/REPORT.md
          echo "=========================================="
          echo "Output structure:"
          find output -type f | sort

      # ── 11. Upload all results as artifact ────────────────────────────
      - name: Upload decompilation artifact
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-${{ github.run_id }}
          path: output/
          retention-days: 14
          if-no-files-found: warn
